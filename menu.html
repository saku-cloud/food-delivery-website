<!- - MENU PAGE(menu.html) - ->
<!DOCTYPE html>
<html>
<head>
<title>Food Menu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
<h1> Food Menu</h1>
</header>
<nav>
<a href="index.html">Home</a>
<a href="menu.html">Menu</a>
<a href="cart.html">Cart</a>
</nav>
<div class="container">
<!-- Search -->
<input type="text" id="search" placeholder="Search food..." onkeyup="searchFood()">
<br><br>
<!-- Filters -->
<button class="filter-btn"
onclick="filterCategory('all')">All</button>
<button class="filter-btn"
onclick="filterCategory('pizza')">Pizza</button>
<button class="filter-btn"
onclick="filterCategory('burger')">Fast Food</button>
<button class="filter-btn"
onclick="filterCategory('drinks')">Drinks</button>
<br><br>
<!-- Food Items -->
<div id="foodList">
<div class="card" data-name="pizza" data-category="pizza">
<img src="images/pizza.jpeg">
<h3>Pizza</h3>
<p>₹250</p>
<button onclick="addToCart('Pizza',250)">Add to Cart</button>
</div>
<div class="card" data-name="burger" data-category="burger">
<im src="images/burger.jpeg">
<h3>Burger</h3>
<p>₹120</p>
<button onclick="addToCart('Burger',120)">Add to Cart</button>
</div>
<div class="card" data-name="pasta" data-category="pizza">
<img src="images/pasta.jpeg">
<h3>Pasta</h3>
<p>₹180</p>
<button onclick="addToCart('Pasta',180)">Add to Cart</button>
</div>
<div class="card" data-name="sandwich" data-category="burger">
<img src="images/sandwich.jpeg">
<h3>Sandwich</h3>
<p>₹90</p>
<button onclick="addToCart('Sandwich',90)">Add to Cart</button>
</div>
<div class="card" data-name="fries" data-category="burger">
<img src="images/fries.jpeg">
<h3>French Fries</h3>
<p>₹100</p>
<button onclick="addToCart('Fries',100)">Add to Cart</button>
</div>
<div class="card" data-name="cold drink" data-category="drinks">
<img src="images/drink.jpeg">
<h3>Cold Drink</h3>
<p>₹60</p> 
<button onclick="addToCart('Cold Drink',60)">Add to Cart</button>
</div>
</div>
</div>
<script src="js/script.js"></script>
</body>
</html>
